<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>마지막 미션</title><link rel="stylesheet" href="assets/style.css"><script src="assets/game.js"></script></head><body>
<main class="shell"><div class="topbar"><div class="brand">📚 도서관을 찾아라!</div><div class="progress">마지막</div></div><section class="card"><div class="hero"><div class="badge">🏁 마지막 미션</div><div class="illustration"><div class="photo-placeholder"><span class="emoji">🏛️</span><strong>도서관에 도착했어요!</strong><small>이제 도서관의 이름을 맞혀 주세요.</small></div></div></div><div class="body"><p class="mission" id="question"></p><div class="hintbox" id="hint"></div><form class="form" id="form"><label for="answer" style="font-weight:900">도서관 이름</label><input class="answer" id="answer" autocomplete="off" placeholder="도서관 이름을 입력해 주세요"><button class="btn btn-primary" type="submit">도착 확인하기 🎯</button></form><div class="feedback" id="feedback" aria-live="polite"></div></div></section></main>
<script>question.textContent=GAME_CONFIG.final.question;hint.textContent='💡 '+GAME_CONFIG.final.hint;form.addEventListener('submit',e=>{e.preventDefault();if(isCorrect(answer.value,GAME_CONFIG.final.answers)){location.href='ending.html';}else{feedback.className='feedback no';feedback.textContent='조금만 더! 도서관 이름을 다시 확인해 보세요 😊';answer.select();}});</script></body></html>
