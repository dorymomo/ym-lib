<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>1단계 - 도서관을 찾아라!</title><link rel="stylesheet" href="assets/style.css"><script src="assets/game.js"></script></head><body>
<main class="shell"><div class="topbar"><div class="brand">📚 도서관을 찾아라!</div><div class="progress">1 / 4</div></div><section class="card"><div class="hero"><div class="badge">🔎 1번째 길</div><div class="illustration"><img id="stageImage" alt=""></div></div><div class="body"><p class="mission" id="question"></p><div class="hintbox" id="hint"></div><form class="form" id="form"><label for="answer" style="font-weight:900">장소 이름</label><input class="answer" id="answer" autocomplete="off" placeholder="여기에 입력해 주세요" aria-describedby="feedback"><button class="btn btn-primary" type="submit">정답 확인</button></form><div class="feedback" id="feedback" aria-live="polite"></div><div class="direction" id="direction"><span id="successText"></span><span class="arrow" id="arrow"></span>다음 장소로 이동해 볼까요?</div><div class="actions"><a class="btn btn-primary next-btn" id="nextBtn" href="#" style="place-items:center">다음 장소로 이동하기</a></div></div></section></main>
<script>
const stage=GAME_CONFIG.stages[1-1];
stageImage.src=stage.image; stageImage.alt=stage.imageAlt; question.textContent=stage.question; hint.textContent='💡 힌트: '+stage.hint;
const next='1'==='4'?'success.html':'stage1.html'; nextBtn.href=next;
form.addEventListener('submit',e=>{e.preventDefault();if(isCorrect(answer.value,stage.answers)){feedback.className='feedback ok';feedback.textContent='정답이에요! 🎉';successText.textContent=stage.successText;arrow.textContent=stage.arrow;direction.classList.add('show');nextBtn.classList.add('show');nextBtn.style.display='grid';answer.disabled=true;form.querySelector('button').disabled=true;}else{feedback.className='feedback no';feedback.textContent='앗! 사진을 한 번 더 살펴볼까요? 😊';answer.select();}});
</script></body></html>
