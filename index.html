<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>도서관 길찾기 탐험</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans KR",Arial,sans-serif;background:#f4f7fb;color:#1f2937}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 50px}.card{background:#fff;border-radius:24px;padding:26px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.badge{background:#eef2ff;padding:8px 14px;border-radius:999px;font-weight:800}
.progress{font-weight:800;color:#667085}h1{font-size:32px;margin:14px 0 10px}p{font-size:18px;line-height:1.65}
.photo{width:100%;border-radius:20px;overflow:hidden;margin:20px 0;background:#e8edf4}.photo img{display:block;width:100%;height:auto;aspect-ratio:16/10;object-fit:cover}
.q{font-size:21px;font-weight:900;margin:18px 0 12px}.row{display:flex;gap:10px;flex-wrap:wrap}
input{flex:1 1 260px;font-size:18px;padding:15px 16px;border-radius:14px;border:2px solid #cfd6e2;outline:none}
input:focus{border-color:#6574ff}button{border:0;border-radius:14px;padding:15px 20px;font-size:18px;font-weight:900;cursor:pointer;background:#5367ff;color:#fff}
.msg{min-height:30px;margin-top:13px;font-size:18px;font-weight:800}.good{color:#16733a}.bad{color:#b9362b}
.dir{display:none;margin-top:16px;background:#f1f5ff;border-radius:16px;padding:18px;font-size:21px;font-weight:900;text-align:center}
.hidden{display:none}.finish{text-align:center}.finish .emoji{font-size:68px}.reward{margin-top:20px;background:#fff5c9;border-radius:18px;padding:22px;font-size:21px;font-weight:900;line-height:1.7}
.restart{margin-top:20px;background:#e9edf4;color:#222}.small{text-align:center;margin-top:16px;color:#777;font-size:14px}
@media(max-width:520px){.card{padding:19px}h1{font-size:27px}p,.q{font-size:17px}button{width:100%}}
</style>
</head>
<body>
<div class="wrap"><div class="card">
  <div class="head"><span class="badge">도서관 길찾기 탐험</span><span id="progress" class="progress">시작</span></div>

  <section id="start">
    <h1>사진을 보고 도서관을 찾아가요!</h1>
    <p>사진 속 장소의 이름을 직접 입력해 보세요. 정답을 맞히면 다음에 어느 방향으로 가야 하는지 알려줄게요.</p>
    <div class="photo"><img src="images/police.jpg" alt="첫 번째 길찾기 장소 예시 사진"></div>
    <button id="startBtn">탐험 시작!</button>
  </section>

  <section id="game" class="hidden">
    <h1 id="title"></h1>
    <div class="photo"><img id="placeImg" src="" alt="장소를 맞히기 위한 사진"></div>
    <div class="q">사진 속 장소는 어디일까요?</div>
    <form id="form"><div class="row">
      <input id="answer" type="text" placeholder="장소 이름을 입력하세요" autocomplete="off">
      <button type="submit">확인</button>
    </div></form>
    <div id="msg" class="msg" aria-live="polite"></div>
    <div id="dir" class="dir"></div>
  </section>

  <section id="finish" class="hidden finish">
    <div class="emoji">🎉📚</div>
    <h1>도서관 도착!</h1>
    <div class="photo"><img src="images/library.jpg" alt="도착한 도서관 사진"></div>
    <p>길을 잘 찾아서 도서관에 도착했어요!</p>
    <div class="reward">이 화면을 사서 선생님에게 보여주면<br>상품을 받을 수 있어요!</div>
    <button id="restart" class="restart">처음부터 다시하기</button>
  </section>

  <div class="small">실제 행사 사진이 정해지면 images 폴더의 사진만 바꿔도 됩니다.</div>
</div></div>

<script>
const stages=[
 {name:"경찰서",answers:["경찰서"],img:"images/police.jpg",dir:"정답! 경찰서에서 왼쪽으로 가세요. ⬅️"},
 {name:"메가박스",answers:["메가박스","메가 박스"],img:"images/megabox.jpg",dir:"정답! 메가박스에서 오른쪽으로 가세요. ➡️"},
 {name:"슈퍼",answers:["슈퍼","슈퍼마켓","마트"],img:"images/super.jpg",dir:"정답! 슈퍼에서 오른쪽으로 가세요. ➡️"},
 {name:"편의점",answers:["편의점"],img:"images/store.jpg",dir:"정답! 편의점에서 왼쪽으로 가세요. ⬅️"}
];
let idx=0, locked=false, timer=null;
const start=document.getElementById("start"),game=document.getElementById("game"),finish=document.getElementById("finish");
const progress=document.getElementById("progress"),title=document.getElementById("title"),placeImg=document.getElementById("placeImg");
const form=document.getElementById("form"),answer=document.getElementById("answer"),msg=document.getElementById("msg"),dir=document.getElementById("dir");
function norm(s){return s.trim().replace(/\s+/g,"").toLowerCase()}
function showStage(i){
 idx=i;locked=false;clearTimeout(timer);
 const s=stages[i];progress.textContent=(i+1)+" / "+stages.length;title.textContent=(i+1)+"번째 장소";
 placeImg.src=s.img;answer.value="";answer.disabled=false;msg.textContent="";msg.className="msg";dir.style.display="none";dir.textContent="";
 answer.focus();
}
document.getElementById("startBtn").addEventListener("click",()=>{start.classList.add("hidden");finish.classList.add("hidden");game.classList.remove("hidden");showStage(0)});
form.addEventListener("submit",e=>{
 e.preventDefault();if(locked)return;
 const v=norm(answer.value);if(!v){msg.textContent="장소 이름을 입력해 주세요!";msg.className="msg bad";return}
 const s=stages[idx],ok=s.answers.some(a=>norm(a)===v);
 if(!ok){msg.textContent="앗! 사진을 다시 잘 살펴볼까요?";msg.className="msg bad";return}
 locked=true;answer.disabled=true;msg.textContent="정답이에요!";msg.className="msg good";dir.textContent=s.dir;dir.style.display="block";
 timer=setTimeout(()=>{if(idx<stages.length-1)showStage(idx+1);else{game.classList.add("hidden");finish.classList.remove("hidden");progress.textContent="도착!"}},3000);
});
document.getElementById("restart").addEventListener("click",()=>{clearTimeout(timer);finish.classList.add("hidden");game.classList.add("hidden");start.classList.remove("hidden");progress.textContent="시작"});
</script>
</body></html>
